services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_clean_ddd_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: 123123
      DATABASE_URL: postgresql+asyncpg://postgres:123456@postgres:5432/database
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: app.events
      RABBITMQ_DLX_EXCHANGE: app.events.dlx
      USER_CREATED_QUEUE: user.created.queue
      USER_CREATED_ROUTING_KEY: user.created.v1
      USER_CREATED_DLQ: user.created.dlq
      USER_CREATED_DLQ_ROUTING_KEY: user.created.dlq.v1
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_PUBLISH_INTERVAL_SECONDS: 2
      OUTBOX_MAX_ATTEMPTS: 10
      MESSAGE_BUS_PROVIDER: rabbitmq
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  worker_outbox_publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_clean_ddd_worker_outbox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: 123123
      DATABASE_URL: postgresql+asyncpg://postgres:123456@postgres:5432/database
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: app.events
      RABBITMQ_DLX_EXCHANGE: app.events.dlx
      USER_CREATED_QUEUE: user.created.queue
      USER_CREATED_ROUTING_KEY: user.created.v1
      USER_CREATED_DLQ: user.created.dlq
      USER_CREATED_DLQ_ROUTING_KEY: user.created.dlq.v1
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_PUBLISH_INTERVAL_SECONDS: 2
      OUTBOX_MAX_ATTEMPTS: 10
      MESSAGE_BUS_PROVIDER: rabbitmq
    command: >
      python src/infrastructure/entrypoints/worker_outbox_publisher.py

  worker_user_created_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_clean_ddd_worker_user_created
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: 123123
      DATABASE_URL: postgresql+asyncpg://postgres:123456@postgres:5432/database
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: app.events
      RABBITMQ_DLX_EXCHANGE: app.events.dlx
      USER_CREATED_QUEUE: user.created.queue
      USER_CREATED_ROUTING_KEY: user.created.v1
      USER_CREATED_DLQ: user.created.dlq
      USER_CREATED_DLQ_ROUTING_KEY: user.created.dlq.v1
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_PUBLISH_INTERVAL_SECONDS: 2
      OUTBOX_MAX_ATTEMPTS: 10
      MESSAGE_BUS_PROVIDER: rabbitmq
    command: >
      python src/infrastructure/entrypoints/worker_user_created_consumer.py

  postgres:
    image: postgres:16-alpine
    container_name: fastapi_clean_ddd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d database"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastapi_clean_ddd_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
